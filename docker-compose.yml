services:
  postgres:
    image: postgres:16
    container_name: fusion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fusion
      POSTGRES_PASSWORD: fusionpw
      POSTGRES_DB: fusion
    ports:
      - "5432:5432"
    volumes:
      - fusion-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fusion -d fusion"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fusion-pgdata:
